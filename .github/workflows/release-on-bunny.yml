name: Deploy Frontend to Bunny CDN

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The API address is baked into the bundle at build time, so a wrong or
      # missing one ships a site where every request 404s or points at
      # localhost - and the build still succeeds, so nothing complains until
      # a player loads the page.
      #
      # This workflow previously hardcoded https://ampcoin-50q9kxt9.b4a.run,
      # which is NOT the live backend (that host 404s on /api/health; the real
      # service is the Railway one). It is read from a repository variable now,
      # with no fallback, so that a moved service cannot leave a stale address
      # baked into production again.
      #
      # Set REACT_APP_API_URL under Settings -> Secrets and variables ->
      # Actions -> Variables.
      - name: Resolve API URL
        id: api
        env:
          CONFIGURED: ${{ vars.REACT_APP_API_URL }}
        run: |
          if [ -z "$CONFIGURED" ]; then
            echo "::error::Repository variable REACT_APP_API_URL is not set."
            echo "::error::The API address is compiled into the bundle, so the site"
            echo "::error::would ship pointing at nothing. Set it under:"
            echo "::error::Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi
          echo "url=$CONFIGURED" >> "$GITHUB_OUTPUT"

      - name: Build React frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ steps.api.outputs.url }}
        run: npm run build

      - name: Verify the built bundle targets the right backend
        working-directory: frontend
        env:
          EXPECTED: ${{ steps.api.outputs.url }}
        run: |
          # Belt and braces. The build step above can silently succeed with a
          # wrong address; this reads the artifact and refuses to deploy unless
          # the string that actually shipped is the one we asked for.
          if ! grep -rqF "$EXPECTED" build/static/js/; then
            echo "::error::Built bundle does not contain $EXPECTED."
            echo "::error::Refusing to deploy a build pointing at the wrong backend."
            exit 1
          fi
          echo "Bundle targets $EXPECTED"

      - name: Deploy to Bunny CDN Storage
        uses: BunnyWay/actions/pull-zone-cdn-action@main
        env:
          BUNNYY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNYY_ZONE_NAME: ${{ secrets.BUNNY_ZONE_NAME }}
          BUNNYY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNYY_STORAGE_ACCESSKEY: ${{ secrets.BUNNY_STORAGE_ACCESSKEY }}
        with:
          sourceDir: "frontend/build/"
