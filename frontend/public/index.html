<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Applies the saved theme before first paint so there is no flash.
      //
      // This deliberately does NOT validate the id against a hardcoded list.
      // That list silently drifted out of sync with theme.js and rejected any
      // theme it was missing, so picking that theme and reloading snapped back
      // to Default. theme.js is the single source of truth and corrects an
      // invalid id a moment later; an unknown id is harmless, a rejected good
      // one is not.
      (function () {
        var root = document.documentElement;
        var stored = null;
        try {
          stored = localStorage.getItem('ampcoin-theme') || localStorage.getItem('ampbet-theme');
        } catch (error) {
          stored = null;
        }
        if (stored && /^[a-z0-9-]{1,32}$/i.test(stored)) {
          root.setAttribute('data-theme', stored);
        } else if (!root.getAttribute('data-theme')) {
          root.setAttribute('data-theme', 'default');
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030807" />
    <meta
      name="description"
      content="AMPcoin - An Adopt Me Casino-style item betting platform"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>AMPcoin - Item Betting Platform</title>
  </head>
