<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Pet image unavailable">
  <defs>
    <!-- Colours match the site surfaces: bg1 is #0b0f17, panel2 is #121924, and
         the accent is #2f81f7. A placeholder that clashes with its own page is
         worse than no placeholder at all.

         Note: no double hyphens anywhere in this file's comments. An XML comment
         cannot contain them, and the result is a file that serves fine but never
         renders. -->
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d29"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="gem" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5b9cff"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="14" fill="url(#surface)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="13.25"
        fill="none" stroke="rgba(148,163,184,0.16)" stroke-width="1.5"/>

  <!-- The item glyph: a faceted diamond, drawn small and centred so it reads as
       "this is an item tile" rather than as a loading error. -->
  <g opacity="0.92">
    <path d="M64 34 L86 58 L64 94 L42 58 Z" fill="url(#gem)" opacity="0.22"/>
    <path d="M64 34 L86 58 L64 94 L42 58 Z" fill="none"
          stroke="#5b9cff" stroke-width="2.5" stroke-linejoin="round" opacity="0.75"/>
    <path d="M64 34 L64 94 M42 58 L86 58" stroke="#5b9cff"
          stroke-width="1.25" opacity="0.4"/>
  </g>

  <!-- Two quiet tick marks below, so the tile hints at what belongs here (a
       rarity accent and a quantity) without pretending to be real data. -->
  <g opacity="0.32">
    <rect x="46" y="102" width="14" height="3.5" rx="1.75" fill="#8b96a8"/>
    <rect x="64" y="102" width="18" height="3.5" rx="1.75" fill="#8b96a8"/>
  </g>
</svg>